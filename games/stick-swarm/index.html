<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Stick Swarm - auto-attack survival platformer. Run, jump, dash and evolve your weapons against endless stickman swarms.">
<title>Stick Swarm</title>
<style>
:root{--cy:#3ff5ff;--pk:#ff3b6b;--gd:#ffd23f;--vi:#b07bff;--gr:#5dffa0;--bg:#06070d;--pn:rgba(11,15,30,.95);--ln:rgba(140,200,255,.18);--tx:#eef6ff;--mu:#94a7c6;
--f:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:2}
#vig,#vigR{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
#vigR{background:radial-gradient(ellipse at center,rgba(255,23,68,0) 50%,rgba(255,23,68,.65) 100%);opacity:0}
#safe{position:absolute;visibility:hidden;pointer-events:none;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor}
/* ---------- screens ---------- */
#scr>*{margin:auto}
.it .pips{justify-content:flex-start;margin-top:.35rem}
#scr{position:absolute;inset:0;display:none;padding:calc(var(--sat) + .8rem) calc(var(--sar) + .8rem) calc(var(--sab) + .8rem) calc(var(--sal) + .8rem);pointer-events:auto;overflow:auto;touch-action:pan-y}
#scr.on{display:flex}
#scr.dim{background:radial-gradient(ellipse at center,rgba(6,9,20,.74),rgba(2,3,9,.92))}
.panel{position:relative;background:linear-gradient(180deg,rgba(18,24,48,.97),rgba(9,12,25,.97));border:1px solid var(--ln);border-radius:1.4rem;padding:1.3rem;box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);width:min(100%,46rem);max-height:100%;display:flex;flex-direction:column;gap:.9rem;animation:fadeUp .18s ease-out}
.panel.wide{width:min(100%,62rem)}
.panel.narrow{width:min(100%,30rem)}
.ph{display:flex;align-items:center;gap:.7rem}
.ph h2{flex:1;font-size:1.55rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:.6rem}
.ph h2 .ic{color:var(--cy)}
.scroll{overflow:auto;min-height:0;flex:1 1 auto;padding:.2rem .35rem .2rem .1rem;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#2c3a66 transparent}
.sub{color:var(--mu);font-size:.92rem;line-height:1.35}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
.sp{flex:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) rotateX(35deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 18px -4px var(--rc),inset 0 0 0 1px rgba(255,255,255,.05)}50%{box-shadow:0 0 34px 0 var(--rc),inset 0 0 0 1px rgba(255,255,255,.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
/* ---------- buttons ---------- */
.btn{font:inherit;font-weight:800;font-size:1rem;color:var(--tx);background:linear-gradient(180deg,#26325e,#141b37);border:2px solid rgba(140,200,255,.22);border-radius:.95rem;min-height:2.9rem;padding:.5rem 1.1rem;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;transition:transform .12s,border-color .12s,box-shadow .15s,filter .15s;touch-action:manipulation;position:relative;overflow:hidden;white-space:nowrap}
.btn:hover,.btn:focus-visible{border-color:var(--cy);box-shadow:0 0 0 3px rgba(63,245,255,.16),0 8px 24px rgba(63,245,255,.14);transform:translateY(-2px);outline:none}
.btn:active{transform:translateY(1px) scale(.97)}
.btn[disabled]{opacity:.42;pointer-events:none;filter:grayscale(.6)}
.btn.y{background:linear-gradient(180deg,#ffe46b,#ffb300);color:#241700;border-color:#fff1a8;box-shadow:0 5px 0 #a86a00,0 10px 30px rgba(255,180,0,.28)}
.btn.y:hover,.btn.y:focus-visible{box-shadow:0 5px 0 #a86a00,0 0 0 3px rgba(255,220,80,.35),0 12px 34px rgba(255,180,0,.45)}
.btn.y:active{box-shadow:0 2px 0 #a86a00}
.btn.c{background:linear-gradient(180deg,#45ecff,#119fc4);color:#00222b;border-color:#c0fcff}
.btn.v{background:linear-gradient(180deg,#a47bff,#6a3be0);border-color:#d8c6ff}
.btn.g{background:linear-gradient(180deg,#6dffae,#19b765);color:#002814;border-color:#c8ffe0}
.btn.r{border-color:rgba(255,90,120,.55)}
.btn.sm{min-height:2.3rem;font-size:.8rem;padding:.3rem .8rem;border-radius:.75rem}
.btn.ico{width:2.9rem;padding:0}
.btn.big{font-size:2.1rem;min-height:4.4rem;padding:.5rem 3.2rem;border-radius:1.3rem;letter-spacing:.08em}

.btn.on{border-color:var(--cy);background:linear-gradient(180deg,#1d5a72,#123349)}
.kbd{font-size:.68em;opacity:.7;border:1px solid currentColor;border-radius:.35em;padding:0 .35em;margin-left:.2em}
/* ---------- menu ---------- */
.menu{width:100%;min-height:100%;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;gap:.5rem}
.mtop{width:100%;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;background:rgba(8,12,26,.75);border:1px solid var(--ln);border-radius:99px;padding:.38rem .9rem;font-weight:800;font-size:.95rem;white-space:nowrap}
.gold{color:var(--gd)}.cyan{color:var(--cy)}.pink{color:var(--pk)}.vio{color:var(--vi)}.grn{color:var(--gr)}.mut{color:var(--mu)}
.mc{display:flex;flex-direction:column;align-items:center;gap:.85rem}
.logo{font-weight:900;font-style:italic;line-height:.82;text-align:center;transform:rotate(-5deg);margin-bottom:.4rem;pointer-events:none}
.logo b{display:block;font-size:clamp(2.6rem,9vh,5rem);color:#fff;text-shadow:.06em .06em 0 #0b0b12,0 0 .4em rgba(63,245,255,.45);letter-spacing:.01em}
.logo i{display:block;font-size:clamp(3.1rem,11vh,6.2rem);font-style:italic;background:linear-gradient(180deg,#fff58a 10%,#ffbf00 55%,#ff7d00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(.05em .06em 0 #0b0b12) drop-shadow(0 0 .25em rgba(255,170,0,.4));margin-left:.6em}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-weight:800;font-size:.8rem;color:var(--tx);background:rgba(10,14,30,.8);border:1px solid var(--ln);border-radius:99px;padding:.42rem .85rem;display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;transition:border-color .12s,transform .12s;touch-action:manipulation}
.chip:hover,.chip:focus-visible{border-color:var(--cy);outline:none;transform:translateY(-1px)}
.chip small{color:var(--mu);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(8.5rem,1fr));gap:.55rem;width:min(100%,42rem)}
.mfoot{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:.6rem;color:var(--mu);font-size:.75rem}
/* ---------- level-up cards ---------- */
.lvl h1{font-size:1.9rem;font-weight:800;letter-spacing:.14em;text-align:center;color:#fff}
.cards{display:flex;gap:1rem;justify-content:center;perspective:900px}
.card{--rc:#7fa6d9;font:inherit;color:var(--tx);width:15rem;min-height:19rem;border-radius:1.2rem;padding:1.1rem .95rem;background:linear-gradient(180deg,rgba(30,40,74,.98),rgba(12,16,32,.98));border:2px solid var(--rc);display:flex;flex-direction:column;align-items:center;text-align:center;gap:.55rem;cursor:pointer;animation:fadeUp .2s ease-out backwards;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.35);position:relative;overflow:hidden;transition:transform .12s,border-color .12s;touch-action:manipulation}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 24px -6px var(--rc)}
.card.rare{--rc:#3ff5ff}.card.epic{--rc:#c47bff}.card.legend{--rc:#ffd23f}
.card .rar{font-size:.7rem;font-weight:900;letter-spacing:.18em;color:var(--rc);text-transform:uppercase}
.card .cic{width:4.6rem;height:4.6rem;border-radius:1.1rem;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);color:var(--rc);font-size:2.3rem}
.card .cn{font-size:1.25rem;font-weight:900}
.card .cl{font-size:.8rem;font-weight:800;color:var(--gd);letter-spacing:.06em}
.card .cd{font-size:.92rem;color:#c9d6ea;line-height:1.35;flex:1}
.card .ck{position:absolute;top:.55rem;left:.7rem;font-size:.75rem;font-weight:900;color:var(--mu)}
.card .tags{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center}
.card .tags span{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mu)}
.card.banish{--rc:#ff3b6b}

.pips{display:flex;gap:3px;justify-content:center}
.pips i{width:.55rem;height:.55rem;border-radius:2px;background:#26304f}
.pips i.on{background:var(--gd)}.pips i.nx{background:#fff}
/* ---------- lists ---------- */
.list{display:grid;gap:.6rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.65rem}
.item{display:flex;gap:.8rem;align-items:center;padding:.75rem .85rem;border-radius:1rem;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.item.sel{border-color:var(--cy);background:rgba(63,245,255,.08);box-shadow:0 0 18px -6px var(--cy)}
.item.lock{opacity:.75}
.hcard{flex-direction:column;text-align:center;gap:.55rem;padding:1rem .8rem}
.hcard .it{width:100%}
.hcard .ib.hero{width:min(8rem,100%);height:auto;aspect-ratio:1}
.ib.hero{width:4.6rem;height:4.6rem;padding:0;overflow:hidden;position:relative;border:1px solid rgba(63,245,255,.35)}
.ib.hero img{width:100%;height:100%;display:block}
.ib.hero.dim img{filter:grayscale(.8) brightness(.55)}
.ib.hero .ic{position:absolute;inset:0;margin:auto;color:#fff}
.item .ib{width:3rem;height:3rem;border-radius:.8rem;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);font-size:1.6rem;flex:none}
.item .it{flex:1;min-width:0}
.item .it b{display:block;font-size:1.02rem}
.item .it span{display:block;font-size:.82rem;color:var(--mu);line-height:1.3}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.stat{display:flex;justify-content:space-between;gap:1rem;padding:.42rem .2rem;border-bottom:1px solid rgba(255,255,255,.06);font-size:.95rem}
.stat b{font-weight:900}
.big3{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
.big3 div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:1rem;padding:.65rem .4rem;text-align:center}
.big3 b{display:block;font-size:1.55rem;font-weight:900}
.big3 span{font-size:.7rem;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{color:var(--mu);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:.4rem}
td{padding:.5rem .4rem;border-top:1px solid rgba(255,255,255,.06)}
tr.me td{color:var(--gd)}
.set{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;align-items:center}
.set label{font-weight:800;font-size:.95rem}
.set .rg{width:min(15rem,42vw);display:flex;align-items:center;gap:.5rem}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:.8rem;overflow:hidden}
.seg button{font:inherit;font-weight:800;font-size:.78rem;color:var(--mu);background:transparent;border:0;padding:.5rem .7rem;cursor:pointer;text-transform:uppercase;min-height:2.3rem}
.seg button.on{background:var(--cy);color:#002229}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.tg{width:3.3rem;height:1.9rem;border-radius:99px;background:#26304f;border:0;position:relative;cursor:pointer;transition:background .15s}
.tg::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;transition:transform .18s}
.tg[aria-checked=true]{background:var(--cy)}
.tg[aria-checked=true]::after{transform:translateX(1.4rem)}
.tg:focus-visible{outline:2px solid #fff;outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.9rem;background:transparent;touch-action:none;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:.45rem;border-radius:9px;background:linear-gradient(90deg,var(--cy) var(--v,50%),#26304f var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;margin-top:-.45rem;box-shadow:0 0 0 4px rgba(63,245,255,.28)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,255,255,.6)}
input[type=range]::-moz-range-track{height:.45rem;border-radius:9px;background:#26304f}
input[type=range]::-moz-range-progress{height:.45rem;border-radius:9px;background:var(--cy)}
input[type=range]::-moz-range-thumb{width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;border:0}
.ach{display:flex;gap:.7rem;align-items:center;padding:.6rem .7rem;border-radius:.9rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.ach.done{border-color:rgba(255,210,63,.45);background:rgba(255,210,63,.07)}
.ach .ib{width:2.5rem;height:2.5rem;border-radius:.7rem;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:var(--mu);font-size:1.3rem;flex:none}
.ach.done .ib{color:var(--gd)}
.ach b{font-size:.92rem}.ach span{display:block;font-size:.78rem;color:var(--mu)}
.bar{height:.4rem;border-radius:9px;background:#1e2745;overflow:hidden;margin-top:.3rem}
.bar i{display:block;height:100%;background:var(--cy)}
.res h1{font-size:3rem;font-weight:900;font-style:italic;text-align:center;letter-spacing:.03em}
.res h1.win{background:linear-gradient(180deg,#fff58a,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,190,0,.4))}
.res h1.lose{color:var(--pk);text-shadow:0 0 22px rgba(255,59,107,.45)}
.coinbig{display:flex;align-items:center;justify-content:center;gap:.6rem;font-size:2rem;font-weight:900;color:var(--gd)}
.evo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.evo .cic{width:6.5rem;height:6.5rem;border-radius:1.6rem;display:flex;align-items:center;justify-content:center;font-size:3.4rem;color:var(--gd);border:2px solid var(--gd);background:radial-gradient(circle,rgba(255,210,63,.25),transparent 70%);box-shadow:0 0 30px -6px #ffd23f;--rc:#ffd23f}
.evo h1{font-size:2.3rem;font-weight:900;font-style:italic;color:var(--gd)}
.ring{width:6rem;height:6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:900;background:conic-gradient(var(--gd) calc(var(--p)*1%),#26304f 0);margin:0 auto;position:relative}
.ring::before{content:"";position:absolute;inset:.45rem;border-radius:50%;background:#0d1226}
.ring span{position:relative}
/* ---------- in-game DOM controls ---------- */
#topbtn{position:absolute;top:calc(var(--sat) + .7rem);right:calc(var(--sar) + .7rem);display:none;gap:.45rem;pointer-events:auto}
#topbtn.on{display:flex}
#topbtn .btn{width:2.6rem;min-height:2.6rem;padding:0;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);font-size:1rem;box-shadow:none}
#topbtn .btn:hover,#topbtn .btn:focus-visible{transform:none;border-color:rgba(255,255,255,.5);box-shadow:none}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#touch.lefty{transform:scaleX(-1)}
#touch.lefty .tb>*{transform:scaleX(-1)}
#touch.lefty #pad{transform:scaleX(-1)}
#touch.lefty #pad>*{transform:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-weight:900;font-size:.72rem;letter-spacing:.06em;touch-action:none;transition:background .08s,border-color .08s,transform .08s}
.tb .ic{font-size:1.9em}
.tb.down{background:rgba(255,255,255,.22);border-color:#fff;transform:scale(.95)}
#pad{left:calc(var(--sal) + .8rem);bottom:calc(var(--sab) + .8rem);width:clamp(160px,15rem,250px);height:clamp(96px,8.5rem,150px);border-radius:0;border:0;flex-direction:row;justify-content:space-between;padding:0;background:transparent}
#pad .ar{width:clamp(66px,6.4rem,104px);height:clamp(66px,6.4rem,104px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.28);font-size:2rem;transition:background .08s}
#pad .ar.down{background:rgba(255,255,255,.22);border-color:#fff}
#pad .dn{display:none}
#pad .dn.down{opacity:1;color:var(--cy)}
#bJump{right:calc(var(--sar) + 1rem);bottom:calc(var(--sab) + 1rem);width:clamp(78px,7.4rem,128px);height:clamp(78px,7.4rem,128px)}
#bDash{right:calc(var(--sar) + clamp(92px,9rem,154px));bottom:calc(var(--sab) + .8rem);width:clamp(62px,5.6rem,98px);height:clamp(62px,5.6rem,98px)}
#bUlt{right:calc(var(--sar) + 1.6rem);bottom:calc(var(--sab) + clamp(88px,8.8rem,150px));width:clamp(60px,5.4rem,94px);height:clamp(60px,5.4rem,94px);border:0;background:conic-gradient(var(--gd) calc(var(--p,0)*1%),rgba(255,255,255,.13) 0)}
#bUlt::before{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(18,26,54,.85)}
#bUlt>*{position:relative}
#bUlt.ready{box-shadow:0 0 18px rgba(255,210,63,.55)}
#bUlt.ready::before{background:rgba(90,66,0,.85)}
#bDash b{position:absolute;top:-.4rem;right:-.2rem;background:var(--cy);color:#002229;border-radius:99px;font-size:.75rem;min-width:1.3rem;height:1.3rem;display:flex;align-items:center;justify-content:center}
#toasts{position:absolute;top:calc(var(--sat) + 4.6rem);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;z-index:5;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:.6rem;background:linear-gradient(180deg,rgba(40,32,8,.95),rgba(20,16,4,.95));border:1px solid rgba(255,210,63,.6);color:#fff;border-radius:1rem;padding:.55rem 1rem;font-weight:800;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(255,210,63,.2);animation:fadeUp .2s ease-out;transition:opacity .4s,transform .4s}
.toast .ic{color:var(--gd);font-size:1.4rem}
.toast small{display:block;color:var(--mu);font-weight:700;font-size:.75rem}
.toast.out{opacity:0;transform:translateY(-10px)}
/* ---------- responsive ---------- */
@media (max-aspect-ratio:1/1){
  .cards{flex-direction:column;align-items:stretch;gap:.6rem}
  .card{width:100%;min-height:0;flex-direction:row;text-align:left;padding:.8rem}
  .card .cic{width:3.4rem;height:3.4rem;font-size:1.7rem;flex:none}
  .card .tags,.card .rar{justify-content:flex-start}
  .card .ck{display:none}

const PART_CAP = [250, 550, 900];
function part(x, y, vx, vy, life, size, col, kind = 0, g = 0, add = true) {

  o.x = x; o.y = y; o.vx = vx; o.vy = vy; o.life = o.max = life; o.size = size; o.col = col; o.kind = kind; o.g = g; o.add = add;
  o.rot = FR(0, TAU); o.vr = FR(-12, 12); o.grow = 0;

}
function sparks(x, y, n, col, spd = 300, life = 0.35) {
  n = Math.ceil(n * [0.4, 0.7, 1][G.quality]);
  for (let i = 0; i < n; i++) { const a = FR(0, TAU), s = FR(0.3, 1) * spd; part(x, y, Math.cos(a) * s, Math.sin(a) * s, FR(0.6, 1) * life, FR(1.5, 3), col, 1, 300); }
}
function ring(x, y, r0, r1, life, col, w = 3) { const o = part(x, y, 0, 0, life, r0, col, 3); if (o) { o.grow = r1; o.vr = w; } }
function deathBurst(x, y, col, scale = 1) {

  for (let i = 0; i < n; i++) { const a = FR(0, TAU), s = FR(120, 380) * scale; part(x, y, Math.cos(a) * s, Math.sin(a) * s - 120, FR(0.4, 0.8), FR(7, 14) * scale, col, 2, 900, false); }

// 7-point verlet ragdoll: 0 head, 1 neck, 2 hip, 3/4 hands, 5/6 feet
const RD_LINKS = [0, 1, 1, 2, 1, 3, 1, 4, 2, 5, 2, 6, 3, 2, 4, 2];
const RD_LEN = [0.14, 0.32, 0.36, 0.36, 0.47, 0.47, 0.5, 0.5];
const DOLLS = []; for (let i = 0; i < 48; i++) DOLLS.push({ p: new Float32Array(14), q: new Float32Array(14), life: 0, h: 50, col: '#fff', a: 1 });
function spawnDoll(x, feet, h, col, vx, vy, face) {
  if (G.quality === 0 && DOLLS.filter(d => d.life > 0).length > 18) return false;
  let d = null; for (const o of DOLLS) if (o.life <= 0) { d = o; break; }
  if (!d) return false;
  const P = d.p, Q = d.q, dt = 1 / 60;
  const pose = [0, -h * 0.92, 0, -h * 0.79, 0, -h * 0.47, face * h * 0.2, -h * 0.5, -face * h * 0.2, -h * 0.5, face * h * 0.12, 0, -face * h * 0.12, 0];
  for (let i = 0; i < 7; i++) {
    P[i * 2] = x + pose[i * 2]; P[i * 2 + 1] = feet + pose[i * 2 + 1];
    const up = i < 2 ? 1.25 : i > 4 ? 0.75 : 1;   // head flies harder, feet lag: makes it tumble
    Q[i * 2] = P[i * 2] - (vx * up + FR(-60, 60)) * dt; Q[i * 2 + 1] = P[i * 2 + 1] - (vy * up + FR(-60, 60)) * dt;
  }
  d.life = 1.7; d.h = h; d.col = col; return true;
}
function updateDolls(dt) {
  const g = CONFIG.gravity * dt * dt;
  for (const d of DOLLS) {
    if (d.life <= 0) continue;
    d.life -= dt; const P = d.p, Q = d.q;
    for (let i = 0; i < 14; i += 2) {
      const vx = (P[i] - Q[i]) * 0.992, vy = (P[i + 1] - Q[i + 1]) * 0.992;
      Q[i] = P[i]; Q[i + 1] = P[i + 1]; P[i] += vx; P[i + 1] += vy + g;
      if (P[i + 1] > A.ground) { P[i + 1] = A.ground; Q[i + 1] = A.ground + vy * 0.35; Q[i] = P[i] - vx * 0.6; }
      if (P[i] < G.arenaL) { P[i] = G.arenaL; Q[i] = P[i] + vx * 0.5; } else if (P[i] > G.arenaR) { P[i] = G.arenaR; Q[i] = P[i] + vx * 0.5; }
    }
    for (let it = 0; it < 3; it++) for (let k = 0; k < RD_LINKS.length; k += 2) {
      const a = RD_LINKS[k] * 2, b = RD_LINKS[k + 1] * 2, L = RD_LEN[k / 2] * d.h;
      const dx = P[b] - P[a], dy = P[b + 1] - P[a + 1], dist = Math.sqrt(dx * dx + dy * dy) || 1, diff = (dist - L) / dist * 0.5;

    c.beginPath(); c.arc(P[0], P[1], d.h * 0.13, 0, TAU); c.fill();

function updateFX(dt) {
  updateDolls(dt);
  for (const o of G.parts.list) {
    o.life -= dt; if (o.life <= 0) { o.dead = true; continue; }
    if (o.kind === 3) continue;
    o.vy += o.g * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
    if (o.kind === 2 && o.y > A.ground - 2 && o.vy > 0) { o.y = A.ground - 2; o.vy *= -0.35; o.vx *= 0.6; o.vr *= 0.5; }
  }
  G.parts.sweep();
  for (const o of G.nums.list) { o.life -= dt; o.y += o.vy * dt; o.vy *= 0.92; if (o.life <= 0) o.dead = true; }
  G.nums.sweep();
  for (const o of G.splats.list) { o.life -= dt; if (o.life <= 0) o.dead = true; }
  G.splats.sweep();
  for (const r of G.ripples) r.t += dt;
  for (const g of G.ghosts) g.t += dt;
  for (let i = G.slashes.length - 1; i >= 0; i--) { const s = G.slashes[i]; s.t += dt; if (s.t >= s.life) G.slashes.splice(i, 1); }

   ENTITIES — player creation, stats, movement, damage

function makePlayer(ch) {
  return {
    x: A.w / 2, y: A.ground, px: A.w / 2, py: A.ground, vx: 0, vy: 0, face: 1, grounded: true, onPlat: false, dropT: 0,
    coyote: 0, jumpBuf: 0, jumping: false, dashes: ch.dashes, dashMax: ch.dashes, dashT: 0, dashTime: 0, dashDir: 1,
    iframes: 1, hurtT: 0, hp: 1, maxHp: 0, xp: 0, level: 1, ult: 0, weapons: [], passives: {}, pOrder: [],
    runPh: 0, sq: 1, lunge: 0, shield: 0, airJumps: 0, flipT: 0, stomp: false, ghostT: 0, regenAcc: 0, slowT: 0, dead: false, airT: 0, ultReadyShown: false

function recalc() {
  const p = G.player, ch = G.run.char, ps = p.passives, sh = k => Save.shop(k), m = G.run.mods;
  const oldMax = p.maxHp;
  p.maxHp = Math.round((ch.hp + sh('hp') * 10) * (m.hpMul || 1));

  p.area = 1 + 0.1 * (ps.area | 0);
  p.dur = 1 + 0.12 * (ps.duration | 0);

  p.luck = 1 + 0.1 * (ps.luck | 0);
  p.greed = 1 + 0.2 * (ps.greed | 0);

const dmgMul = () => G.player.might * (1 + tierBuff('dmg'));

// lands a falling body on ground/platforms; returns surface y or -1
function landOn(x, prevFeet, feet, halfW, dropping) {
  if (feet >= A.ground) return A.ground;
  if (dropping) return -1;
  for (const pl of CONFIG.platforms) {
    if (x + halfW > pl.x && x - halfW < pl.x + pl.w && prevFeet <= pl.y + 0.5 && feet >= pl.y) return pl.y;
  }
  return -1;
}

function updatePlayer(dt) {
  const p = G.player;
  p.px = p.x; p.py = p.y;
  if (p.dead) return;
  const L = Input.left(), Rt = Input.right(), D = Input.down();

  p.sq = lerp(p.sq, 1, 1 - Math.exp(-14 * dt));
  if (Input.jumpQ) { Input.jumpQ = false; p.jumpBuf = PC.buffer; }
  if (Input.dashQ) { Input.dashQ = false; tryDash(dir); }
  if (Input.ultQ) { Input.ultQ = false; tryUlt(); }
  if (p.dashes < p.dashMax) { p.dashT += dt; if (p.dashT >= PC.dashRecharge) { p.dashT = 0; p.dashes++; } }
  if (p.regen > 0 && p.hp < p.maxHp) { p.hp = Math.min(p.maxHp, p.hp + p.regen * dt); }

      else if (p.coyote > 0) {
        p.vy = -PC.jumpV * Math.sqrt(G.run.mods.grav || 1); p.jumpBuf = 0; p.coyote = 0; p.grounded = false; p.jumping = true; p.sq = 1.25;
        Sound.play('jump'); for (let i = 0; i < 5; i++) part(p.x, p.y, FR(-120, 120), FR(-60, 0), 0.3, 2, '#ffffff', 0, 0, false);
      } else if (!p.grounded && p.airJumps < PC.airJumps) {

      }
    }
    if (Input.downQ) { Input.downQ = false; if (!p.grounded && p.airT > 0.08 && !p.stomp) { p.stomp = true; p.vy = 1250; p.flipT = 0; p.jumping = false; Sound.play('dash'); } }
    if (p.jumping && !Input.jumpHeld() && p.vy < 0) { p.vy *= PC.jumpCut; p.jumping = false; }
    if (p.vy >= 0) p.jumping = false;
    p.vy = p.stomp ? Math.max(p.vy, 1250) : Math.min(p.vy + grav * dt, PC.fall);
    if (p.stomp && G.frame % 2 === 0) part(p.x + FR(-6, 6), p.y - 40, 0, -60, 0.25, 3, skinCol(), 0);
  }
  p.x += p.vx * dt;

      if (!wasGround && p.airT > 0.12) { p.sq = 0.72; Sound.play('land'); for (let i = 0; i < 6; i++) part(p.x + FR(-10, 10), s, FR(-150, 150), FR(-80, -10), 0.3, 2, '#cfe', 0, 300, false); }
      if (p.stomp) stompLand(p, s);
      p.y = s; p.vy = 0; p.grounded = true; p.onPlat = s < A.ground; p.coyote = PC.coyote; p.airT = 0; p.airJumps = 0; p.flipT = 0;
    } else { p.grounded = false; }
  } else p.grounded = false;

  p.runPh += dt * (p.grounded ? Math.abs(p.vx) * 0.035 : 4);

}

// stomp: crash down and send enemies flying
function stompLand(p, s) {

  for (let i = 0; i < n; i++) { const e = Hash.buf[i]; damage(e, 26 * dmgMul(), ho(Math.sign(e.x - p.x || 1) * 330, -520)); }
  ring(p.x, s, 10, 120, 0.3, skinCol(), 5); sparks(p.x, s, 16, skinCol(), 420); ripple(p.x, 28); shake(0.3); Sound.play('slam');

}
function dashTrail(p) {
  const tr = Save.data.trail;
  let g = G.ghosts[0]; for (const o of G.ghosts) if (o.t > g.t) g = o;
  g.x = p.x; g.y = p.y; g.face = p.face; g.t = 0; g.ph = p.runPh;

function tryDash(dir) {

  if (p.dashes <= 0 || p.dashTime > 0) return;
  p.dashes--; Quests.add('dash', 1); p.dashDir = dir || p.face; p.face = p.dashDir; p.dashTime = PC.dashTime; p.iframes = Math.max(p.iframes, PC.dashIframes);
  p.ghostT = 0; Sound.play('dash'); Save.data.stats.dashes++; G.run.dashes++;
  ring(p.x, p.y - 30, 10, 60, 0.25, skinCol(), 2);
  if (Save.data.stats.dashes % 50 === 0) Ach.check();
}

function hurtPlayer(dmg, sx, src) {
  const p = G.player;
  if (p.iframes > 0 || p.dead || G.state !== 'play') return false;
  if (p.shield > 0) { p.shield--; p.iframes = 0.5; ring(p.x, p.y - 30, 20, 70, 0.3, '#7fe9ff', 4); sparks(p.x, p.y - 30, 10, '#7fe9ff', 260); Sound.play('crit'); return false; }
  dmg *= G.run.mods.taken || 1;
  dmg = Math.max(1, Math.round(dmg - p.armor));
  p.hp -= dmg; p.iframes = PC.iframes; p.hurtT = 0.35;
  const kd = p.x < sx ? -1 : 1; p.vx = kd * 430; p.vy = Math.min(p.vy, -360); p.grounded = false; p.dashTime = 0; p.stomp = false; G.run.lastHitX = sx;
  ring(p.x, p.y - 30, 6, 46, 0.22, '#ffffff', 3);
  G.run.tookHit = true; if (G.boss) G.boss.playerHit = true;
  shake(0.4); G.hurtFlash = Save.data.settings.flash ? 0.12 : 0.35; G.hitstop = Math.max(G.hitstop, 3);
  Sound.play('hurt');
  p.ult = Math.min(CONFIG.ult.max, p.ult + dmg * CONFIG.ult.perHurt);
  num(p.x, p.y - 70, dmg, false, '#ff6b8a');
  sparks(p.x, p.y - 30, 10, PAL.danger, 300);
  G.run.lastHitBy = src || '';
  if (p.hp <= 0) { p.hp = 0; playerDown(); }

}

function heal(n) { const p = G.player; const h = Math.min(p.maxHp - p.hp, n); if (h <= 0) return; p.hp += h; num(p.x, p.y - 70, '+' + Math.round(h), false, '#5dffa0'); }

/* =====================================================================
   SPATIAL HASH — enemies bucketed into cells; queries never scan everyone
   ===================================================================== */
const Hash = {
  cs: 80, x0: -400, y0: -1100, cols: 0, rows: 0, head: null, next: new Int32Array(512), ents: [], buf: new Array(512),
  init() { this.cols = Math.ceil((A.w + 800) / this.cs); this.rows = Math.ceil((A.ground + 1300) / this.cs); this.head = new Int32Array(this.cols * this.rows); },
  build() {
    this.head.fill(-1); const l = G.enemies.list; this.ents = l;
    for (let i = 0; i < l.length; i++) { const e = l[i]; if (e.dead) continue; const c = this.cell(e.x, e.y); this.next[i] = this.head[c]; this.head[c] = i; }
  },
  cell(x, y) { return clamp(((y - this.y0) / this.cs) | 0, 0, this.rows - 1) * this.cols + clamp(((x - this.x0) / this.cs) | 0, 0, this.cols - 1); },
  // fills Hash.buf with live targets (enemies + boss) touching circle (x,y,r); returns the count
  query(x, y, r) {
    const out = this.buf, m = r + 40, cs = this.cs; let n = 0;
    const c0 = clamp(((x - m - this.x0) / cs) | 0, 0, this.cols - 1), c1 = clamp(((x + m - this.x0) / cs) | 0, 0, this.cols - 1);
    const r0 = clamp(((y - m - this.y0) / cs) | 0, 0, this.rows - 1), r1 = clamp(((y + m - this.y0) / cs) | 0, 0, this.rows - 1);
    for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) {
      let i = this.head[cy * this.cols + cx];
      while (i !== -1) {
        const e = this.ents[i];
        if (!e.dead) { const dx = e.x - x, dy = e.y - y, rr = r + e.r; if (dx * dx + dy * dy < rr * rr && n < 500) out[n++] = e; }
        i = this.next[i];
      }
    }
    const b = G.boss;
    if (b && !b.dead && b.targetable) { const dx = b.x - x, dy = b.y - y, rr = r + b.r; if (dx * dx + dy * dy < rr * rr) out[n++] = b; }
    return n;
  }
};

/* =====================================================================
   ENEMIES — spawning, AI, status effects, damage and death
   ===================================================================== */
const HO = { kx: 0, ky: 0, crit: true, proj: false, st: 0, sp: 0, sd: 0, dot: false };
function ho(kx, ky, proj, st, sp, sd) { HO.kx = kx; HO.ky = ky; HO.proj = !!proj; HO.st = st | 0; HO.sp = sp || 0; HO.sd = sd || 0; HO.crit = true; HO.dot = false; return HO; }
const DOT = { kx: 0, ky: 0, crit: false, proj: false, st: 0, sp: 0, sd: 0, dot: true };
const ST = { BURN: 1, SLOW: 2, SHOCK: 3, BLEED: 4, FREEZE: 5 };

function spawnEnemy(type, x, y, elite = false, force = false) {
  const def = CONFIG.enemies[type]; if (!def) return null;
  if (!force && G.enemies.list.length >= CONFIG.director.cap) return null;
  const e = G.enemies.spawn(); if (!e) return null;
  const run = G.run, D = CONFIG.director, tm = run.effMin;
  const hpS = (1 + D.hpPerMin * tm) * run.diff.hp * (run.mods.ehp || 1) * (1 + run.loop * 0.9);
  e.id = G.idSeq++; e.type = type; e.def = def; e.ai = def.ai;
  e.scale = elite ? 1.4 : 1; e.r = def.r * e.scale; e.hh = def.h * e.scale / 2;
  e.x = e.px = x; e.y = e.py = y; e.vx = 0; e.vy = 0;
  e.maxHp = e.hp = def.hp * hpS * (elite ? D.eliteHp : 1);
  e.dmg = def.dmg * (1 + D.dmgPerMin * tm) * run.diff.dmg * (1 + run.loop * 0.3);
  e.spd = def.spd * FR(0.88, 1.12) * (run.mods.espd || 1);
  e.xp = def.xp * (elite ? 8 : 1); e.col = PAL.enemy[def.col]; e.elite = elite;
  e.affix = elite ? pick(['fast', 'armored', 'explosive']) : '';
  if (e.affix === 'fast') e.spd *= 1.45;
  e.face = x < G.player.x ? 1 : -1; e.grounded = false; e.onPlat = false; e.dropT = 0; e.jumpCd = R(0.5, 2.5);
  e.state = 0; e.st = R(1, 3); e.anim = R(0, 10); e.flash = 0; e.stagger = 0; e.spawnT = 0; e.charging = false;
  e.burnT = e.slowT = e.shockT = e.bleedT = e.freezeT = 0; e.burnDps = e.bleedDps = 0; e.dot = 0; e.hitT.fill(0);
  e.tx = 0; e.ty = 0; e.shield = !!def.shield; e.heavy = def.heavy || 1; e.boom = false; e.isBoss = false; e.vis = 1; e.lastKx = 0;
  return e;
}

const onScreen = (x, y, m = 0) => { const c = G.cam, vw = G.viewW / c.z, vh = G.viewH / c.z; return x > c.x - m && x < c.x + vw + m && y > c.y - m && y < c.y + vh + m; };

function groundPhys(e, dt, tvx, acc) {
  if (e.stagger > 0) e.vx *= Math.pow(0.03, dt); else e.vx = approach(e.vx, tvx, acc * dt);
  e.vy = Math.min(e.vy + CONFIG.gravity * dt, 1200);
  e.x += e.vx * dt;
  if (e.x < G.arenaL + e.r) { e.x = G.arenaL + e.r; if (e.vx < 0) e.vx = 0; }
  if (e.x > G.arenaR - e.r) { e.x = G.arenaR - e.r; if (e.vx > 0) e.vx = 0; }
  const pf = e.y + e.hh; e.y += e.vy * dt; e.dropT -= dt;
  if (e.vy >= 0) { const s = landOn(e.x, pf, e.y + e.hh, e.r * 0.5, e.dropT > 0); if (s >= 0) { e.y = s - e.hh; e.vy = 0; e.grounded = true; e.onPlat = s < A.ground; } else e.grounded = false; }
  else e.grounded = false;
}
// hop up to platforms / drop down toward the player
function chase(e, dt, adx) {
  const p = G.player; e.jumpCd -= dt;
  if (!e.grounded || e.jumpCd > 0 || e.stagger > 0) return;
  const feet = e.y + e.hh;
  if (p.y < feet - 90 && adx < 300 && p.grounded) { e.vy = -Math.min(1080, Math.sqrt(2 * CONFIG.gravity * (feet - p.y + 40))); e.grounded = false; e.jumpCd = R(1.2, 2.6); }
  else if (p.y > feet + 60 && e.onPlat && adx < 340) { e.dropT = 0.3; e.jumpCd = R(1, 2); }
  else e.jumpCd = R(0.25, 0.7);
}

function updateEnemies(dt) {
  const p = G.player, pcy = p.y - PC.h / 2, vw = G.viewW / G.cam.z;
  for (const e of G.enemies.list) {
    if (e.dead) continue;
    e.px = e.x; e.py = e.y; e.spawnT += dt; e.flash -= dt; e.stagger -= dt; e.anim += dt;
    let sm = 1;
    if (e.freezeT > 0) { e.freezeT -= dt; sm = 0; }
    if (e.shockT > 0) { e.shockT -= dt; sm *= 0.15; }
    if (e.slowT > 0) { e.slowT -= dt; sm *= 0.5; }
    if (e.burnT > 0) { e.burnT -= dt; e.dot += e.burnDps * dt; }
    if (e.bleedT > 0) { e.bleedT -= dt; e.dot += e.bleedDps * dt; }
    if (e.dot >= 5) { const d = e.dot; e.dot = 0; damage(e, d, DOT); if (e.dead) continue; }
    const dx = p.x - e.x, adx = Math.abs(dx), dir = dx > 0 ? 1 : -1;
    // stragglers far behind are brought back near the action
    if (adx > vw * 1.25 && e.spawnT > 3 && e.state === 0) {
      e.x = e.px = clamp(p.x + (rng() < 0.5 ? -1 : 1) * (vw * 0.6 + 80), G.arenaL + 30, G.arenaR - 30);
      if (!(e.ai === 'fly' || e.ai === 'ghost' || e.ai === 'bat')) { e.y = e.py = A.ground - e.hh; e.vy = 0; }
    }
    switch (e.ai) {
      case 'walk': if (adx > 6) e.face = dir; groundPhys(e, dt, e.face * e.spd * sm * (adx < 6 ? 0 : 1), 900); chase(e, dt, adx); break;
      case 'hop':
        if (e.grounded) { e.vx = approach(e.vx, 0, 900 * dt); e.st -= dt * sm; if (e.st <= 0 && sm > 0) { e.face = dir; e.vy = -R(520, 760); e.vx = dir * e.spd * 1.7; e.grounded = false; e.st = R(0.5, 1.1); } }
        groundPhys(e, dt, e.vx, 0); break;
      case 'fly': flyAI(e, dt, dir, adx, sm); break;
      case 'ghost': {
        // drifts through walls and platforms; fades out and can't be hit while faded
        e.st -= dt; const cyc = (e.anim % 5.2); e.vis = cyc < 2.6 ? 1 : cyc < 3.0 ? 1 - (cyc - 2.6) / 0.4 : cyc < 4.8 ? 0 : (cyc - 4.8) / 0.4;
        const sp = e.spd * sm * (e.vis < 0.5 ? 1.5 : 1), tx = p.x - e.x, ty = (pcy - 10) - e.y, d = Math.hypot(tx, ty) || 1;
        if (e.stagger > 0) { e.vx *= 0.9; e.vy *= 0.9; } else { e.vx = approach(e.vx, tx / d * sp, 300 * dt); e.vy = approach(e.vy, ty / d * sp + Math.sin(e.anim * 3) * 40, 300 * dt); }
        e.x = clamp(e.x + e.vx * dt, G.arenaL + e.r, G.arenaR - e.r); e.y = clamp(e.y + e.vy * dt, -300, A.ground - e.hh); e.face = dir; break;
      }
      case 'bat': {
        const tx = p.x + Math.sin(e.anim * 3 + e.id) * 90, ty = pcy - 40 + Math.cos(e.anim * 4 + e.id) * 70, sp = e.spd * sm;
        if (e.stagger > 0) { e.vx *= 0.9; e.vy *= 0.9; } else { e.vx = approach(e.vx, clamp((tx - e.x) * 3, -sp, sp), 900 * dt); e.vy = approach(e.vy, clamp((ty - e.y) * 3, -sp, sp), 900 * dt); }
        e.x = clamp(e.x + e.vx * dt, G.arenaL + e.r, G.arenaR - e.r); e.y = clamp(e.y + e.vy * dt, -300, A.ground - e.hh); e.face = e.vx >= 0 ? 1 : -1; break;
      }
      case 'leap':
        if (e.state === 0) {
          if (adx > 6) e.face = dir; groundPhys(e, dt, e.face * e.spd * sm, 900); e.st -= dt;
          if (e.st <= 0 && e.grounded && adx < 420 && sm > 0 && onScreen(e.x, e.y, -20)) { e.state = 1; e.st = 0.55; e.face = dir; e.tx = p.x; Sound.play('tele'); }
        } else if (e.state === 1) { groundPhys(e, dt, 0, 2000); e.st -= dt; if (e.st <= 0) { e.state = 2; e.vy = -880; e.vx = clamp((e.tx - e.x) / 0.85, -560, 560); e.grounded = false; e.charging = true; } }
        else { groundPhys(e, dt, e.vx, 0); if (e.grounded && e.vy >= 0) { e.state = 0; e.st = R(1.4, 2.6); e.charging = false; sparks(e.x, e.y + e.hh, 6, e.col, 200); } }
        break;
      case 'bomber': {
        e.face = dir; const want = e.state ? 0 : adx > 480 ? dir : adx < 320 ? -dir : 0;
        groundPhys(e, dt, want * e.spd * sm, 700); chase(e, dt, adx); e.st -= dt * (sm > 0 ? 1 : 0);
        if (e.state === 0 && e.st <= 0 && adx < 700 && onScreen(e.x, e.y, -20)) { e.state = 1; e.st = 0.5; }
        else if (e.state === 1 && e.st <= 0) {
          // lob a bomb: the landing spot is marked for a full second before it blows
          e.state = 0; e.st = R(3, 4.2);
          const tx = p.x, ty = surfaceBelow(p.x, p.y - 2), T = 1.0, g = 1400;
          part(e.x, e.y - 30, (tx - e.x) / T, (ty - (e.y - 30) - 0.5 * g * T * T) / T, T, 9, e.col, 0, g, false);
          addHazard({ shape: 'circ', x: tx, y: ty - 30, r: 75, warn: 1.0, life: 0.15, dmg: e.dmg, src: 'bomber', onActive: hz => boomFX(hz.x, hz.y + 20, hz.r, PAL.danger) });
          Sound.play('eshot');
        }
        break;
      }
      case 'shoot': case 'summon': {
        e.face = dir;
        const want = e.state ? 0 : adx > 470 ? dir : adx < 300 ? -dir : 0;
        groundPhys(e, dt, want * e.spd * sm, 700); chase(e, dt, adx);
        e.st -= dt * (sm > 0 ? 1 : 0);
        if (e.state === 0 && e.st <= 0 && adx < 760 && onScreen(e.x, e.y, -20)) { e.state = 1; e.st = e.ai === 'shoot' ? 0.7 : 0.9; Sound.play('tele'); }
        else if (e.state === 1 && e.st <= 0) {
          e.state = 0;
          if (e.ai === 'shoot') {
            const a = Math.atan2(pcy - (e.y - 8), p.x - e.x), s = 340;
            eShot(e.x + e.face * 14, e.y - 8, Math.cos(a) * s, Math.sin(a) * s, e.dmg, 7); Sound.play('eshot'); e.st = R(2.4, 3.6);
          } else {
            for (let i = 0; i < 3; i++) { const m = spawnEnemy('doodle', e.x + R(-60, 60), e.y - 10); if (m) { m.vy = -300; sparks(m.x, m.y, 6, e.col, 200); } }
            e.st = R(4.5, 6.5);
          }
        }
        break;
      }
      case 'charge':
        if (e.state === 0) {
          if (adx > 6) e.face = dir; groundPhys(e, dt, e.face * e.spd * sm, 900); chase(e, dt, adx); e.st -= dt;
          if (e.st <= 0 && sm > 0 && adx < 540 && e.grounded && Math.abs(p.y - (e.y + e.hh)) < 70 && onScreen(e.x, e.y, -20)) { e.state = 1; e.st = 0.8; e.face = dir; e.tx = e.x + dir * 640; Sound.play('tele'); }
        } else if (e.state === 1) { groundPhys(e, dt, 0, 1600); e.st -= dt; if (e.st <= 0) { e.state = 2; e.st = 1; e.charging = true; } }
        else if (e.state === 2) {
          groundPhys(e, dt, e.face * 680 * (sm > 0 ? 1 : 0), 5000); e.st -= dt;
          if (G.frame % 3 === 0) part(e.x - e.face * e.r, e.y + e.hh - 4, -e.face * 80, -40, 0.3, 3, e.col, 0, 0, true);
          if (e.st <= 0 || (e.face > 0 ? e.x >= e.tx : e.x <= e.tx) || e.x <= G.arenaL + e.r + 1 || e.x >= G.arenaR - e.r - 1) { e.state = 3; e.st = 0.9; e.charging = false; }
        } else { groundPhys(e, dt, 0, 1600); e.st -= dt; if (e.st <= 0) { e.state = 0; e.st = R(1.5, 3); } }
        break;
      case 'explode': {
        const dist = Math.hypot(dx, pcy - e.y);
        if (e.state === 0) { if (adx > 6) e.face = dir; groundPhys(e, dt, e.face * e.spd * sm, 1100); chase(e, dt, adx); if (dist < 90 && sm > 0) { e.state = 1; e.st = 0.75; Sound.play('tele'); } }
        else { groundPhys(e, dt, 0, 1800); e.st -= dt; if (e.st <= 0 && !e.boom) e.boom = true; }
        break;
      }
    }
    if (!p.dead && p.iframes <= 0 && !(e.ai === 'ghost' && e.vis < 0.45) && Math.abs(p.x - e.x) < e.r * 0.8 + PC.w * 0.5 && Math.abs(pcy - e.y) < e.hh * 0.85 + PC.h * 0.5) {
      if (hurtPlayer(e.dmg * (e.charging ? 1.5 : 1), e.x, e.type)) { e.vx = -dir * 340; e.vy = e.ai === 'fly' || e.ai === 'bat' || e.ai === 'ghost' ? -200 : Math.min(e.vy, -180); e.stagger = 0.35; e.charging = false; if (e.state === 2 && e.ai === 'charge') { e.state = 3; e.st = 0.9; } }
    }
  }
}

function flyAI(e, dt, dir, adx, sm) {
  const p = G.player;
  if (e.stagger > 0) { e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= 0.9; e.vy *= 0.9; }
  else if (e.state === 0) {
    const tx = p.x - dir * 170, ty = p.y - 230 + Math.sin(e.anim * 2.2) * 30, sp = e.spd * sm;
    e.vx = approach(e.vx, clamp((tx - e.x) * 2, -sp, sp), 700 * dt); e.vy = approach(e.vy, clamp((ty - e.y) * 2, -sp, sp), 700 * dt);
    e.face = dir; e.st -= dt;
    if (e.st <= 0 && adx < 430 && sm > 0 && onScreen(e.x, e.y, -10)) { e.state = 1; e.st = 0.65; e.tx = p.x; e.ty = p.y - 22; Sound.play('tele'); }
    e.x += e.vx * dt; e.y += e.vy * dt;
  } else if (e.state === 1) {
    e.vx *= 0.9; e.y -= 40 * dt; e.st -= dt;
    if (e.st <= 0) { e.state = 2; e.st = 0.75; const a = Math.atan2(e.ty - e.y, e.tx - e.x); e.vx = Math.cos(a) * 540; e.vy = Math.sin(a) * 540; e.charging = true; }
  } else if (e.state === 2) {
    e.x += e.vx * dt * (sm > 0 ? 1 : 0); e.y += e.vy * dt * (sm > 0 ? 1 : 0); e.st -= dt;
    if (e.y > A.ground - e.hh) { e.y = A.ground - e.hh; e.vy = -Math.abs(e.vy) * 0.3; }
    if (e.st <= 0) { e.state = 3; e.st = 0.8; e.charging = false; }
  } else {
    e.vx *= 0.95; e.vy = approach(e.vy, -200, 700 * dt); e.x += e.vx * dt; e.y += e.vy * dt; e.st -= dt;
    if (e.st <= 0) { e.state = 0; e.st = R(1.6, 3.2); }
  }
  e.x = clamp(e.x, G.arenaL + e.r, G.arenaR - e.r); e.y = clamp(e.y, -320, A.ground - e.hh);
}

// queued after the hash is built, since explosions query neighbours

  const p = G.player;

const CHAIN_HIT = [];
function chainFrom(start, jumps, hop, dmg, shock) {
  CHAIN_HIT.length = 0;
  const p = G.player, pts = [p.x + p.face * 10, p.y - 44];
  let cur = start;
  while (cur && CHAIN_HIT.length <= jumps) {
    CHAIN_HIT.push(cur.isBoss ? -1 : cur.id); pts.push(cur.x, cur.y);
    const cx = cur.x, cy = cur.y;
    damage(cur, dmg, ho(0, 0, false, ST.SHOCK, 0, shock)); sparks(cx, cy, 5, '#bff6ff', 220, 0.25);
    const n = Hash.query(cx, cy, hop); let best = null, bd = 1e12;
    for (let j = 0; j < n; j++) { const e = Hash.buf[j]; if (e.dead || CHAIN_HIT.includes(e.isBoss ? -1 : e.id)) continue; const d = (e.x - cx) ** 2 + (e.y - cy) ** 2; if (d < bd) { bd = d; best = e; } }
    cur = best;
  }
  G.bolts.push({ pts, t: 0, life: 0.2 }); Sound.play('zap');
}

function updateWeapons(dt) { const p = G.player; if (p.dead) return; if (G.frenzyT > 0) { G.frenzyT -= dt; dt *= 2; } for (const w of p.weapons) WEAP[w.id](w, dt, p); }

function updateShots(dt) {
  const p = G.player;
  for (const s of G.shots.list) {
    if (s.dead) continue;
    s.px = s.x; s.py = s.y; s.life -= dt;
    if (s.life <= 0) { s.dead = true; continue; }
    if (s.kind === 'boom') {
      s.t += dt; s.rot += 18 * dt;
      if (!s.ret) { const f = Math.min(1, s.t / s.T), e = 1 - (1 - f) * (1 - f); s.x = s.ox + s.vx * s.range * e; s.y = s.oy + s.vy * s.range * e; if (f >= 1) s.ret = true; }
      else { const dx = p.x - s.x, dy = p.y - 36 - s.y, d = Math.hypot(dx, dy) || 1; if (d < 26) { s.dead = true; continue; } const sp = s.spd * 1.15 * dt; s.x += dx / d * sp; s.y += dy / d * sp; }
    } else if (s.kind === 'bomb') {
      s.vy += s.g * dt; const pf = s.y; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += 10 * dt;
      if (s.vy > 0) { const surf = landOn(s.x, pf, s.y, 2, false); if (surf >= 0) { s.y = surf; inkExplode(s); s.dead = true; continue; } }
    } else { s.x += s.vx * dt; s.y += s.vy * dt; if (s.kind === 'stick') s.rot += 22 * dt; }
    if (s.x < G.arenaL - 120 || s.x > G.arenaR + 120 || s.y < -1000 || s.y > A.ground + 40) { s.dead = true; continue; }
    const n = Hash.query(s.x, s.y, s.r);
    for (let j = 0; j < n; j++) {
      const e = Hash.buf[j];
      if (s.kind === 'boom') { if (e.hitT[s.ix] > G.t) continue; e.hitT[s.ix] = G.t + CW.boom.hitCd * (e.isBoss ? 0.4 : 1); damage(e, s.dmg, ho(Math.sign(e.x - s.x) * 160, -80, true, s.burn ? ST.BURN : 0, s.dmg * 0.35)); continue; }
      if (s.kind === 'bomb') { inkExplode(s); s.dead = true; break; }
      const id = e.isBoss ? -1 : e.id; if (s.hits.includes(id)) continue; s.hits.push(id);
      damage(e, s.dmg, ho(Math.sign(s.vx) * (s.kind === 'cres' ? 260 : 140), -60, true, s.burn ? ST.BURN : 0, s.dmg * 0.45));
      if (s.kind !== 'cres') sparks(s.x, s.y, 3, '#ffffff', 180, 0.2);
      if (--s.pierce < 0) { s.dead = true; break; }
    }
  }
  G.shots.sweep();
}

function inkExplode(s) {
  const n = Hash.query(s.x, s.y - 10, s.pr);
  for (let i = 0; i < n; i++) { const e = Hash.buf[i]; damage(e, s.dmg, ho(Math.sign(e.x - s.x) * 200, -200, false, ST.SLOW, 0, 1.5)); }
  const sy = s.y >= A.ground - 1 ? A.ground : surfaceBelow(s.x, s.y);
  G.pools.push({ x: s.x, y: sy, w: s.pr * 2, life: s.pl, max: s.pl, dps: s.dps, big: s.big, tick: 0, seed: Math.random() * 99 });
  if (G.pools.length > 24) G.pools.shift();
  ring(s.x, s.y, 8, s.pr, 0.3, '#8f7bff', 4); sparks(s.x, s.y, 12, '#8f7bff', 320); ripple(s.x, 8); Sound.play('pop');
}
function updatePools(dt) {
  for (let i = G.pools.length - 1; i >= 0; i--) {
    const o = G.pools[i]; o.life -= dt;
    if (o.life <= 0) { G.pools.splice(i, 1); continue; }
    if (o.big) for (const e of G.enemies.list) { if (e.dead) continue; const dx = o.x - e.x; if (Math.abs(dx) < o.w * 1.1 && Math.abs(e.y - o.y) < 160) e.x += Math.sign(dx) * Math.min(Math.abs(dx), 260 * dt); }
    o.tick -= dt; if (o.tick > 0) continue; o.tick = 0.25;
    const n = Hash.query(o.x, o.y - 30, o.w / 2 + 10);
    for (let j = 0; j < n; j++) {
      const e = Hash.buf[j];
      if (!e.isBoss && Math.abs(e.y + e.hh - o.y) > 60) continue;
      ho(0, 0, false, ST.SLOW, 0, 1.2); HO.crit = false; HO.dot = true; damage(e, o.dps * 0.25, HO);

  }
}
function updateWaves(dt) {
  for (let i = G.waves.length - 1; i >= 0; i--) {
    const v = G.waves[i], step = CW.slam.spd * dt; v.x += v.dir * step; v.d += step;
    if (v.d >= v.max || v.x < v.minX || v.x > v.maxX) { G.waves.splice(i, 1); continue; }
    const n = Hash.query(v.x, v.y - v.h / 2, v.h / 2 + 8);
    for (let j = 0; j < n; j++) {
      const e = Hash.buf[j];
      if (!e.isBoss && Math.abs(e.y + e.hh - v.y) > 40) continue;
      if (e.hitT[v.ix] > G.t) continue; e.hitT[v.ix] = G.t + 0.5;
      damage(e, v.dmg * 0.7, ho(v.dir * 240, -380, false, v.frz ? ST.FREEZE : 0, 0, 0.7));
    }
    if (G.frame % 2 === 0) part(v.x, v.y, FR(-40, 40), FR(-280, -120), 0.35, 3, v.frz ? '#bff6ff' : skinCol(), 0, 900);
  }
}

function addWeapon(id, lv = 1) {
  const p = G.player; let w = p.weapons.find(o => o.id === id);
  if (!w) { w = { id, lvl: 0, t: 0.4, evo: false, a: 0, ix: WIDS.indexOf(id), d: null, n: 0, rad: 0, len: 0 }; p.weapons.push(w); }
  w.lvl = Math.min(8, w.lvl + lv);
  if (p.weapons.length >= 6) Ach.check();
}
function addPassive(id, lv = 1) { const p = G.player; if (!p.passives[id]) p.pOrder.push(id); p.passives[id] = Math.min(CONFIG.passiveMax, (p.passives[id] | 0) + lv); recalc(); }
const evolvable = () => G.player.weapons.find(w => w.lvl >= 8 && !w.evo && G.player.passives[WDEF[w.id].evo.p]);

/* ---------- Ultimate: Swarm Burst ---------- */
function tryUlt() {
  const p = G.player, U = CONFIG.ult;
  if (p.ult < U.max || p.dead) return;
  p.ult = 0; G.run.ults++; Save.data.stats.ults++; Quests.add('ult', 1);
  const vw = G.viewW / G.cam.z, x0 = G.cam.x - 60, x1 = G.cam.x + vw + 60;
  for (const e of G.enemies.list) {
    if (e.dead || e.x < x0 || e.x > x1) continue;
    if (!e.elite && e.def.hp <= 20) killEnemy(e);
    else damage(e, e.maxHp * U.dmgPct + U.flat * dmgMul(), ho(Math.sign(e.x - p.x) * 520, -420));
  }
  const b = G.boss;
  if (b && !b.dead && b.targetable && b.x > x0 && b.x < x1) { ho(0, 0); HO.crit = false; b.hurt(b.maxHp * U.bossPct, false, HO); }
  for (const s of G.ebullets.list) s.dead = true;
  ring(p.x, p.y - 30, 20, vw * 0.7, 0.6, '#ffd23f', 10); ring(p.x, p.y - 30, 10, vw * 0.45, 0.5, '#ffffff', 5);
  sparks(p.x, p.y - 30, 40, '#ffd23f', 700, 0.6);
  flash('#fff6c8', 0.6); shake(0.8); ripple(p.x, 40);
  G.slowT = U.slowTime; G.slowScale = U.slow; p.iframes = Math.max(p.iframes, 1);
  Sound.play('ult'); Ach.check();
}

  return addHazard(Object.assign({ shape: 'rect', x: (G.arenaL + G.arenaR) / 2, w: G.arenaR - G.arenaL, y: (y0 + y1) / 2, h: y1 - y0, warn, life, dmg, src }, extra || {}));

  Sound.play('eshot');
}

  pick(ts) {

function rollChoices(n = 3) {
  const p = G.player, run = G.run, opts = [];
  for (const w of p.weapons) if (w.lvl < 8 && !run.banned.includes(w.id)) opts.push({ t: 'w', id: w.id, wt: 3 });
  if (p.weapons.length < PC.maxWeapons) for (const id of WIDS) if (!p.weapons.find(w => w.id === id) && !run.banned.includes(id)) opts.push({ t: 'w', id, wt: 1.6 });
  for (const id of p.pOrder) if (p.passives[id] < CONFIG.passiveMax && !run.banned.includes(id)) opts.push({ t: 'p', id, wt: 2 });
  if (p.pOrder.length < PC.maxPassives) for (const id of PIDS) if (!p.passives[id] && !run.banned.includes(id)) opts.push({ t: 'p', id, wt: 1.1 });
  for (const o of opts) if (o.t === 'p' && p.weapons.some(w => WDEF[w.id].evo.p === o.id && w.lvl >= 4 && !w.evo)) o.wt += 1.5;
  const out = [];
  while (out.length < n && opts.length) {
    let tot = 0; for (const o of opts) tot += o.wt;
    let r = rng() * tot, k = 0; for (; k < opts.length - 1; k++) { r -= opts[k].wt; if (r <= 0) break; }
    out.push(opts.splice(k, 1)[0]);
  }
  if (out.length < n) out.push({ t: 'heal' });
  if (out.length < n) out.push({ t: 'gold' });
  for (const o of out) { const r = rng() * p.luck; o.rar = (o.t === 'heal' || o.t === 'gold') ? 0 : r > 0.94 ? 2 : r > 0.72 ? 1 : 0; }
  return out;
}
function choiceInfo(o) {

  if (o.t === 'gold') return { name: 'Gold Doodle', icon: 'coin', lvl: '', desc: '+25 coins this run.', tags: ['coins'], cur: 0, max: 0 };
  if (o.t === 'w') {
    const d = WDEF[o.id], w = p.weapons.find(x => x.id === o.id), cur = w ? w.lvl : 0, nx = Math.min(8, cur + (o.rar === 2 ? 2 : 1));

  }

  const evoFor = WIDS.filter(id => WDEF[id].evo.p === o.id).map(id => WDEF[id].name);

}

      if (!el || UI.cur !== 'revive') { clearInterval(UI.revTimer); return; }
      el.textContent = Math.ceil(n); rg.style.setProperty('--p', n / 5 * 100);
      if (n <= 0) { clearInterval(UI.revTimer); this.declineRevive(); }
    }, 100);
  },
  declineRevive() { clearInterval(UI.revTimer); if (G.state === 'dead') this.endRun(); },
  reviveAd() {
    clearInterval(UI.revTimer);
    Platform.rewardedBreak().then(ok => {
      if (G.state !== 'dead') return;
      if (ok) { G.run.adRevived = true; this.revive(0.6); }
      else { UI.toast('video', 'Ad unavailable', 'No revive this time'); this.endRun(); }
    });
  },
  revive(frac) {
    const p = G.player, run = G.run;
    p.dead = false; p.hp = Math.max(1, p.maxHp * frac); p.iframes = 2.5; run.revived = true;
    for (const e of G.enemies.list) if (!e.dead && Math.abs(e.x - p.x) < 450) { if (!e.elite) killEnemy(e); else { e.vx = Math.sign(e.x - p.x) * 700; e.stagger = 0.6; } }
    for (const b of G.ebullets.list) b.dead = true;
    G.hazards.length = 0;
    ring(p.x, p.y - 30, 10, 450, 0.6, '#5dffa0', 8); sparks(p.x, p.y - 30, 30, '#5dffa0', 500); Sound.play('heal');
    UI.hide(); setState('play'); Input.reset(); Platform.gameplayStart(); Music.set(G.boss ? 'boss' : 'play', G.zone, 1); Ach.check();
  },
  victory() {
    const s = Save.data, run = G.run;
    s.wins[run.diffId] = (s.wins[run.diffId] | 0) + 1; if (run.quick) s.wins.quick++; s.stats.wins++;
    Save.save(); Ach.check();
    setState('victory'); Platform.gameplayStop(); Input.reset(); UI.show('victory');
  },
  endless() { const run = G.run; run.endless = true; UI.hide(); setState('play'); Input.reset(); Platform.gameplayStart(); banner('ENDLESS MODE', 'How long can you last?', '#ffd23f', 2.4, true); },
  endRun() {
    const run = G.run, p = G.player, s = Save.data; if (!run || G.state === 'over') return;
    clearInterval(UI.revTimer);
    const dm = { normal: 1, hard: 1.5, nightmare: 2.2 }[run.diffId];
    const score = Math.round((run.kills * 10 + Math.floor(G.t) * 5 + p.level * 50 + run.bossKills * 1000 + (run.won ? 5000 : 0)) * dm);
    const coins = Math.round((run.coins + Math.floor(run.kills / 12) + run.bossKills * 40 + (run.won ? 150 : 0)) * run.diff.reward * (run.daily ? 1.5 : 1) * (run.mods.coinMul || 1) * (1 + 0.1 * Save.shop('coin')));
    s.coins += coins; s.earned += coins; Rank.gain(Math.round(score / 10)); Quests.tick();
    const newBest = score > s.stats.best; s.stats.best = Math.max(s.stats.best, score); s.stats.bestTime = Math.max(s.stats.bestTime, Math.floor(G.t));
    const label = run.daily ? 'Daily · ' + run.mod.name : run.char.name + ' · ' + run.diff.name + ' · ' + (run.rush ? 'Boss Rush' : run.quick ? 'Quick Run' : 'Full Run') + (run.endless ? ' · Endless' : '');
    s.lb.push({ score, time: Math.floor(G.t), kills: run.kills, lvl: p.level, char: run.char.name, mode: run.daily ? 'Daily' : (run.quick ? 'Quick ' : 'Full ') + run.diff.name.slice(0, 1), d: dayKey() });
    s.lb.sort((x, y) => y.score - x.score); s.lb.length = Math.min(10, s.lb.length);
    if (run.daily) { s.stats.dailies++; const k = dayKey(); s.daily[k] = Math.max(s.daily[k] || 0, score); const keys = Object.keys(s.daily); if (keys.length > 30) delete s.daily[keys.sort()[0]]; }
    setState('over'); Ach.check(); Save.save();
    Platform.submitScore(score);
    Platform.gameplayStop(); Music.set('menu');
    this.result = { won: run.won, score, coins, newBest, time: G.t, kills: run.kills, level: p.level, label, cause: run.lastHitBy, doubled: false };
    UI.show('results', this.result);
  },
  doubleCoins() {
    const r = this.result; if (!r || r.doubled) return;
    Platform.rewardedBreak().then(ok => {
      if (!ok) { UI.toast('video', 'Ad unavailable', 'Please try again later'); if (UI.cur === 'results') UI.render(); return; }
      Save.data.coins += r.coins; Save.data.earned += r.coins; r.coins *= 2; r.doubled = true; Save.save(); Sound.play('chest'); Ach.check();
      if (UI.cur === 'results') UI.render();
    });
  },
  retry() { const d = G.run ? G.run.daily : false; this.start(d); },
  toMenu() {
    const go = () => { G.run = null; setState('menu'); Music.set('menu'); UI.show('menu'); };
    if (performance.now() - Platform.lastAd > 120000) Platform.commercialBreak().then(go); else go();
  }
};

/* =====================================================================
   MAIN LOOP — fixed 60 Hz simulation, interpolated rendering
   ===================================================================== */
// keep the floor above the thumbs on portrait touch screens
const floorPad = vh => Touch.visible() ? vh * (G.cssH > G.cssW ? 0.22 : 0.25) : 80;
function updateCamera(dt) {
  const c = G.cam, p = G.player, ib = G.introT > 0 ? G.introBoss : null;
  c.px = c.x; c.py = c.y;
  c.z = lerp(c.z, ib ? 1.22 : 1, 1 - Math.exp(-5 * dt));
  const vw = G.viewW / c.z, vh = G.viewH / c.z;
  const fx = ib ? ib.x : p.x + p.face * 70 + p.vx * 0.12, fy = ib ? ib.y + 120 : p.y;
  let tx = fx - vw / 2; tx = A.w <= vw ? (A.w - vw) / 2 : clamp(tx, 0, A.w - vw);
  const base = A.ground + floorPad(vh) - vh, ty = Math.max(base - 360, Math.min(base, fy - vh * 0.58));
  c.x = lerp(c.x, tx, 1 - Math.exp(-7 * dt)); c.y = lerp(c.y, ty, 1 - Math.exp(-4 * dt));
}
function tick(dt) {
  G.frame++;
  const cam = G.cam, run = G.run, p = G.player;
  G.hurtFlash = Math.max(0, G.hurtFlash - dt * 2); G.flash = Math.max(0, G.flash - dt * 2.5); G.zoneFade = Math.max(0, G.zoneFade - dt * 0.8);
  cam.trauma = Math.max(0, cam.trauma - dt * 1.6);
  for (let i = G.banners.length - 1; i >= 0; i--) { G.banners[i].t += dt; if (G.banners[i].t >= G.banners[i].dur) G.banners.splice(i, 1); }
  for (let i = G.hints.length - 1; i >= 0; i--) { G.hints[i].t += dt; if (G.hints[i].t >= G.hints[i].dur) G.hints.splice(i, 1); }
  if (G.introT > 0) {
    G.introT -= dt; if (G.introBoss) { G.introBoss.anim += dt; G.introBoss.px = G.introBoss.x; G.introBoss.py = G.introBoss.y; }
    p.px = p.x; p.py = p.y; for (const e of G.enemies.list) { e.px = e.x; e.py = e.y; }
    updateCamera(dt); updateFX(dt);
    if (G.introT <= 0) G.introBoss = null;
    return;
  }
  if (G.hitstop > 0) { G.hitstop--; G.freeze = true; return; }
  G.freeze = false;
  let ts = 1; if (G.slowT > 0) { G.slowT -= dt; ts = G.slowScale; }
  const d = dt * ts;
  G.t += d; run.gemT -= d;
  if (G.comboT > 0) { G.comboT -= d; if (G.comboT <= 0) G.combo = 0; }
  if (G.buffT > 0) { G.buffT -= d; if (G.buffT <= 0) G.buff = -1; }
  if (G.wallWarn > 0) G.wallWarn -= d;
  else { G.arenaL = approach(G.arenaL, G.wallL, 420 * d); G.arenaR = approach(G.arenaR, G.wallR, 420 * d); }
  updatePlayer(d);
  if (G.state === 'play') Director.update(d);
  updateEnemies(d); G.enemies.sweep(); Hash.build();
  separate(); explodeEnemies();
  updateWeapons(d); updateShots(d); updateWaves(d); updatePools(d);
  updateEBullets(d); updateHazards(d);
  if (G.boss) G.boss.update(d);
  updateItems(d); updateFX(d); updateCamera(dt);
  if (G.frame % 60 === 0) Quests.tick();
  if (p.ult >= CONFIG.ult.max && !p.ultReadyShown) { p.ultReadyShown = true; hint(Touch.visible() ? 'ULT is ready - tap it for a Swarm Burst!' : 'Press R for a Swarm Burst!', 4); }
  if (G.state !== 'play' || p.dead) return;
  if (run.winAt && G.t >= run.winAt) { run.winAt = 0; Game.victory(); return; }
  if (G.pendingLevels > 0 && G.introT <= 0) Game.levelUp();
}

const Perf = {
  avg: 16.7, hi: 0, lo: 0,
  track(dt) {
    this.avg = this.avg * 0.94 + dt * 1000 * 0.06;
    if (Save.data.settings.quality !== 'auto' || G.state !== 'play') return;
    if (this.avg > 21) { this.hi += dt; this.lo = 0; if (this.hi > 2.5 && G.quality > 0) { G.quality--; this.hi = 0; resize(); } }
    else if (this.avg < 15) { this.lo += dt; this.hi = 0; if (this.lo > 12 && G.quality < 2) { G.quality++; this.lo = 0; resize(); } }
    else this.hi = Math.max(0, this.hi - dt);
  }
};

let lastT = 0, acc = 0, lastUlt = -1, lastDash = -1;
const STEP = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = lastT ? (now - lastT) / 1000 : STEP; lastT = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  G.realT += dt; Perf.track(dt);
  const ticking = (G.state === 'play' || G.state === 'dead') && !Platform.adPlaying && G.run;
  if (ticking) {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 6) { tick(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
    G.alpha = G.freeze ? 1 : acc / STEP;
  } else { acc = 0; G.alpha = 1; }
  if (G.run && Touch.el.classList.contains('on')) {
    const p = G.player, u = Math.floor(p.ult / CONFIG.ult.max * 100);
    if (u !== lastUlt) { lastUlt = u; const b = $('#bUlt'); b.style.setProperty('--p', u); b.classList.toggle('ready', u >= 100); }
    if (p.dashes !== lastDash) { lastDash = p.dashes; $('#dashN').textContent = p.dashes; }
  }
  render();
}

function resize() {
  const W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight);
  G.cssW = W; G.cssH = H;
  G.dpr = Math.min(window.devicePixelRatio || 1, [1, 1.5, 2][G.quality]);
  G.cv.width = Math.round(W * G.dpr); G.cv.height = Math.round(H * G.dpr);
  G.viewH = Math.max(CONFIG.view.h, CONFIG.view.minW * H / W);
  G.S = G.cv.height / G.viewH; G.viewW = G.cv.width / G.S;
  let hs = clamp(H / 640, 0.68, 1.6); if (W / hs < 640) hs = W / 640;
  G.hs = hs; G.hudW = W / hs; G.hudH = H / hs;
  document.documentElement.style.fontSize = clamp(Math.min(W / 72, H / 40), 11, 20) + 'px';
  const cs = getComputedStyle($('#safe'));
  G.safe = { t: parseFloat(cs.paddingTop) / hs || 0, r: parseFloat(cs.paddingRight) / hs || 0, b: parseFloat(cs.paddingBottom) / hs || 0, l: parseFloat(cs.paddingLeft) / hs || 0 };
  G.ctx.imageSmoothingEnabled = true;
  UI.updateTop();
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  G.cv = $('#cv'); G.ctx = G.cv.getContext('2d', { alpha: false });
  await Platform.init();
  Platform.loadingStart();
  Save.load(); PAL = pal();
  const q = Save.data.settings.quality;
  G.quality = q === 'auto' ? (matchMedia('(pointer: coarse)').matches ? 1 : 2) : { low: 0, med: 1, high: 2 }[q];
  Input.touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0 && !matchMedia('(pointer: fine)').matches;
  makePools(); Hash.init();
  Input.init(); Touch.init(); UI.init();
  resize();
  addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 150));
  if (window.visualViewport) visualViewport.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.state === 'play') Game.pause(); Sound.suspend(); } else Sound.unlock(); });
  addEventListener('blur', () => { if (G.state === 'play') Game.pause(); });
  // daily login streak
  const st = Save.data.streak, today = dayKey();
  if (st.day !== today) {
    st.n = st.day === dayKey(new Date(Date.now() - 864e5)) ? st.n + 1 : 1; st.day = today;
    const bonus = 10 * Math.min(st.n, 7); Save.data.coins += bonus; Save.save();
    setTimeout(() => UI.toast('fire', st.n + ' day streak!', '+' + bonus + ' coins daily bonus'), 700);
  }
  Quests.ensure(); loadArt();
  G.state = 'menu'; UI.show('menu'); Music.set('menu');
  Platform.loadingStop();
  if (!Save.data.stats.runs && location.hash !== '#debug') Game.begin(false); // first visit: straight into gameplay
  requestAnimationFrame(frame);
  // test hook, only with #debug in the URL
  if (location.hash === '#debug') window.__SS = { G, tick, render, Game, Save, Director, UI, Input, spawnBoss, addWeapon, addPassive, openChest, tryUlt, killEnemy, spawnEnemy, WIDS, PIDS, Platform, CONFIG };
}
boot();
})();

</script>
